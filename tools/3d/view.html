<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RAD Soldiers — real level</title>
<style>
  html,body{margin:0;height:100%;background:#0e0c0a;overflow:hidden}
  #cv{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:12px;top:10px;font:13px/1.5 monospace;color:#e8e2d4;
       background:rgba(0,0,0,.55);padding:8px 12px;border-radius:8px;white-space:pre}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">loading…</div>
<script type="module">
import * as THREE from './three.module.js';

const hud = document.getElementById('hud');
const log = t => { hud.textContent = t; };
window.__ready = false;
window.__err = null;

try {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc7e8);

  const res = await fetch('./scene.json');
  const data = await res.json();

  const loader = new THREE.TextureLoader();
  const texes = data.textures.map(n => {
    const t = loader.load('./tex/' + n);
    t.colorSpace = THREE.SRGBColorSpace;
    t.flipY = false;                 // Unity UVs
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  });

  const geoms = data.meshes.map(m => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(m.pos, 3));
    if (m.uv && m.uv.length) g.setAttribute('uv', new THREE.Float32BufferAttribute(m.uv, 2));
    g.setIndex(m.idx);
    g.computeVertexNormals();
    return g;
  });

  // the original baked its lighting into the atlases, so unlit reads closer
  // to how it actually looked than a single runtime sun
  const fallback = new THREE.MeshBasicMaterial({ color: 0xb9b2a2 });
  const mats = texes.map(t => new THREE.MeshBasicMaterial({ map: t, alphaTest: 0.35, side: THREE.DoubleSide }));

  const root = new THREE.Group();
  for (const n of data.nodes) {
    const mesh = new THREE.Mesh(geoms[n.mesh], n.tex >= 0 ? mats[n.tex] : fallback);
    mesh.position.set(n.p[0], n.p[1], n.p[2]);
    mesh.quaternion.set(n.q[0], n.q[1], n.q[2], n.q[3]);
    mesh.scale.set(n.s[0], n.s[1], n.s[2]);
    root.add(mesh);
  }
  scene.add(root);

  // frame the level
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const mid = box.getCenter(new THREE.Vector3());

  scene.add(new THREE.AmbientLight(0xffffff, 0.85));
  const sun = new THREE.DirectionalLight(0xfff2d8, 0.85);
  sun.position.set(mid.x + size.x, mid.y + size.y * 3 + 20, mid.z + size.z);
  scene.add(sun);

  // fit the ortho box to the level's projected footprint
  const aspect = window.innerWidth / window.innerHeight;
  const span = Math.max(size.x, size.z) || 40;
  const projW = (size.x + size.z) * 0.70 * 1.06;
  const halfW = projW / 2;
  const halfH = halfW / aspect;
  const cam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.1, 4000);
  cam.position.set(mid.x + span, mid.y + span * 0.95, mid.z + span);
  cam.lookAt(mid);

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.setPixelRatio(1);
  renderer.render(scene, cam);

  log(`${data.source}\nnodes ${data.nodes.length}  meshes ${data.meshes.length}  tex ${data.textures.length}\n` +
      `size ${size.x.toFixed(1)} x ${size.z.toFixed(1)}`);
  window.__ready = true;

  let t = 0;
  function frame() {
    t += 0.0025;
    cam.position.set(mid.x + Math.cos(t) * span, mid.y + span * 0.95, mid.z + Math.sin(t) * span);
    cam.lookAt(mid);
    renderer.render(scene, cam);
    requestAnimationFrame(frame);
  }
  frame();
} catch (e) {
  window.__err = e.message;
  log('ERROR: ' + e.message);
}
</script>
</body>
</html>
